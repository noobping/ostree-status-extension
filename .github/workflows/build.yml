name: Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with Pipeline
        uses: noobping/pipeline@continuous
        with:
          arguments: |
            --cap-jobs
            4
            build

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: ostree-status-extension
          path: dist/*.zip
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install shexli
        run: python -m pip install --disable-pip-version-check shexli==0.2.1

      - name: Install Pipeline and Just
        run: |
          tests/install-ci-tools "$RUNNER_TEMP/pipeline-tools"
          echo "$RUNNER_TEMP/pipeline-tools" >> "$GITHUB_PATH"

      - name: Lint with Pipeline
        run: pipeline --cap-jobs 4 lint

      - name: Upload shexli report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shexli-report
          path: dist/shexli.json
          if-no-files-found: ignore

  smoke:
    name: GNOME Shell ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fedora: "44"
            gnome: "50"
          - fedora: "45"
            gnome: "51"

    steps:
      - uses: actions/checkout@v4

      - name: Install Pipeline and Just
        run: |
          tests/install-ci-tools "$RUNNER_TEMP/pipeline-tools"
          echo "$RUNNER_TEMP/pipeline-tools" >> "$GITHUB_PATH"

      - name: Test with Pipeline
        env:
          GNOME_TEST_IMAGE: docker.io/library/fedora:${{ matrix.fedora }}
          GNOME_TEST_VERSION: ${{ matrix.gnome }}
        run: pipeline --cap-jobs 4 test

      - name: Upload GNOME Shell test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.gnome }}-test-log
          path: dist/gnome-shell-test.log
          if-no-files-found: ignore

  prerelease:
    name: Pre-release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs:
      - build
      - lint
      - smoke

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read GNOME version
        id: gnome
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("metadata.json", encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)

          version = max(map(int, metadata["shell-version"]))
          print(f"version={version}")
          print(f"tag=gnome-{version}")
          PY

      - name: Download extension
        uses: actions/download-artifact@v5
        with:
          name: ostree-status-extension
          path: dist

      - name: Create GNOME pre-release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GNOME_VERSION: ${{ steps.gnome.outputs.version }}
          PRERELEASE_TAG: ${{ steps.gnome.outputs.tag }}
        run: |
          archives=(dist/*.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f ${archives[0]} ]]; then
            echo "expected exactly one extension archive" >&2
            exit 1
          fi

          api_error=$(mktemp)
          trap 'rm -f "$api_error"' EXIT

          if is_prerelease=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$PRERELEASE_TAG" \
            --jq '.prerelease' 2>"$api_error"); then
            if [[ $is_prerelease != true ]]; then
              echo "$PRERELEASE_TAG is an immutable release; leaving it unchanged"
              exit 0
            fi

            echo "replacing prerelease $PRERELEASE_TAG"
            gh release delete "$PRERELEASE_TAG" --yes
          elif ! grep -q 'HTTP 404' "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi

          : >"$api_error"
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$PRERELEASE_TAG" \
            >/dev/null 2>"$api_error"; then
            echo "removing existing tag $PRERELEASE_TAG"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$PRERELEASE_TAG"
          elif ! grep -q 'HTTP 404' "$api_error"; then
            cat "$api_error" >&2
            exit 1
          fi

          gh release create "$PRERELEASE_TAG" \
            "${archives[0]}" \
            --target "$GITHUB_SHA" \
            --title "GNOME $GNOME_VERSION" \
            --prerelease \
            --latest=false \
            --generate-notes
